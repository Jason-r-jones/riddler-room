apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: funhouse-room-prod
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`riddler.nkplab.com`) && PathPrefix(`/r/8WQ36CmwI9OT`)
      kind: Rule
      services:
        - name: funhouse-room-prod
          port: 80
      middlewares:
        - name: funhouse-room-prod-strip
  # Use Traefik entrypoint / default cert store (TLS secret stays in app ns).
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: funhouse-room-prod-strip
spec:
  stripPrefix:
    prefixes:
      - /r/8WQ36CmwI9OT
